<!doctype html><html><head><meta charset="utf-8"><title>BTC Paper Agent</title><style>
body{font:16px system-ui;max-width:1000px;margin:35px auto;background:#10151e;color:#e7edf7}h1{margin-bottom:4px}.note{color:#aab6c8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.card{padding:15px;background:#192230;border-radius:9px}.card b{display:block;font-size:22px;margin-top:5px}button,input{padding:10px;border-radius:6px;border:0;margin-right:8px}button{background:#5ee1a1;color:#072415;font-weight:700;cursor:pointer}button.stop{background:#ff9090}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;border-bottom:1px solid #293546;padding:8px;font-size:13px}.warn{padding:12px;background:#3d2d16;border-radius:7px;color:#ffd28c}</style></head><body>
<h1>BTC/USDT Paper Agent</h1><p class="note">Local simulation · no exchange connection · no real money · event-driven, not HFT infrastructure.</p>
<p><input id="amount" type="number" min="100" step="100" value="10000"><button onclick="allocate()">Allocate paper USD</button><button onclick="post('/api/start')">Start agent</button><button class="stop" onclick="post('/api/stop')">Stop &amp; flatten</button></p>
<p class="warn" id="reason">Loading…</p><section class="grid" id="cards"></section><h2>Recent paper fills</h2><table><thead><tr><th>Time</th><th>Side</th><th>BTC</th><th>Fill</th><th>Fee</th><th>Reason</th></tr></thead><tbody id="trades"></tbody></table>
<script>
async function post(path,data={}){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let d=await r.json();if(d.error)alert(d.error);else render(d)}
function allocate(){post('/api/allocate',{amount:+document.querySelector('#amount').value})}
function money(x){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(x)}
function render(s){document.querySelector('#reason').textContent=s.reason;let a=[['Paper equity',money(s.equity_usd)],['P&L',money(s.pnl_usd)+' ('+s.pnl_pct+'%)'],['BTC price',money(s.price)],['Cash',money(s.cash_usd)],['Position',s.position_btc+' BTC'],['Drawdown',s.drawdown_pct+'%']];document.querySelector('#cards').innerHTML=a.map(x=>`<div class=card>${x[0]}<b>${x[1]}</b></div>`).join('');document.querySelector('#trades').innerHTML=s.trades.slice().reverse().map(t=>`<tr><td>${t.time}</td><td>${t.side}</td><td>${t.btc}</td><td>${money(t.fill)}</td><td>${money(t.fee)}</td><td>${t.why}</td></tr>`).join('')||'<tr><td colspan=6>No trades yet.</td></tr>'}
async function refresh(){let r=await fetch('/api/status');render(await r.json())}refresh();setInterval(refresh,1000)
</script></body></html>
